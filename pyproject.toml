[project]
name = "comptagefer"
version = "0.1.0"
description = "Comptage collaboratif de la fréquentation des TER"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
  "gtfs-realtime-bindings>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# Dépendances de test uniquement : elles ne vont pas dans l'image, qui n'a
# besoin que du serveur. httpx2 est requis par starlette.testclient sur un
# environnement propre — sans lui, pytest ne collecte même pas les tests.
test = [
  "pytest>=8.0",
  "httpx2>=2.0",
  "pytest-playwright>=0.6",
]

[tool.setuptools]
packages = ["comptagefer"]

[tool.setuptools.package-data]
comptagefer = ["*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
