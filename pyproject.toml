[project]
name = "comptagefer"
version = "0.1.0"
description = "Comptage collaboratif de la fréquentation des TER"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
  "gtfs-realtime-bindings>=1.0",
  "tzdata>=2024.1",
]

[tool.setuptools]
packages = ["comptagefer"]

[tool.setuptools.package-data]
comptagefer = ["*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
