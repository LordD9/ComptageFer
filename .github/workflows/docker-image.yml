name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    # Ce workflow ne pousse rien : il verifie seulement que l'image se
    # construit, sur les deux architectures, et qu'elle demarre. Le publish
    # fait le meme build avec les tags ; le faire ici aussi evite d'avoir la
    # mauvaise nouvelle sur main apres le merge.
    - name: Construire l'image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        load: false
        cache-from: type=gha,scope=main
        cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,scope=pr,mode=max,ignore-error=true' || 'type=gha,scope=main,mode=max,ignore-error=true' }}
