name: Docker test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Construit l'image et la demarre vraiment, puis lui parle.
  # C'est le seul test qui prouve que l'image construite sert, pas
  # seulement qu'elle se construit. Publish image construit sur PR
  # mais ne pousse pas ; ici on exerce le conteneur.
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: comptagefer:test
          cache-from: type=gha,scope=main
          cache-to: type=gha,scope=main,mode=max,ignore-error=true

      - name: Demarrer le conteneur
        run: |
          docker run -d --name comptagefer-test -p 8000:8000 \
            -e COMPTAGEFER_DATA=/data \
            -v "$RUNNER_TEMP/data:/data" \
            comptagefer:test

      - name: Attendre que l'application reponde
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "l'application repond apres ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "l'application ne repond pas"
          docker logs comptagefer-test
          exit 1

      - name: Verifier que les pages repondent
        run: |
          set -e
          for chemin in / /comptages /carte /rechercher /methode /offline.js /api/publish; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$chemin")
            echo "$chemin -> $code"
            test "$code" = "200" || { echo "echec sur $chemin"; exit 1; }
          done

      - name: Verifier le tri de la liste
        run: |
          # Le tri est un parametre d'URL : s'il cesse de repondre, la page
          # des comptages perd sa seule facon de se trier, et rien d'autre ne
          # le remarque. Un parametre erronee doit rester lisible aussi.
          for requete in "?tri=passengers&sens=asc" "?tri=date&sens=desc" "?tri=bidon&sens=zzz"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/comptages$requete")
            echo "/comptages$requete -> $code"
            test "$code" = "200" || { echo "echec sur le tri $requete"; exit 1; }
          done

      - name: Verifier les filtres et la vue par paire
        run: |
          # Les filtres sont des parametres d'URL comme le tri, et un
          # filtre casse la page silencieusement : il rend une liste
          # vide, ou la liste entiere. Les deux répondent 200, donc seul
          # un contenu verifie les attrape. Un parametre erronee doit
          # rester lisible, et doit etre NOMMÉ plutot qu'ignore en
          # silence — c'est ce que le test de contenu verifie ici.
          verifier() {
            requete="$1"; attendu="$2"
            corps=$(curl -sS "http://127.0.0.1:8000/comptages$requete")
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/comptages$requete")
            echo "/comptages$requete -> $code"
            test "$code" = "200" || { echo "echec HTTP sur $requete"; exit 1; }
            echo "$corps" | grep -q "$attendu" || {
              echo "echec : '$attendu' absent pour $requete"; exit 1; }
          }
          # La vue par paire regroupe et compte les corridors. Le
          # conteneur de test demarre vide, donc il n'y a ni corridors ni
          # decompte a verifier : ce qui compte ici est que la vue
          # reponde et se distingue de la liste. « 0 paire » ne
          # s'affiche pas — une liste vide ne s'annonce pas — et c'est
          # volontaire, donc on ne l'attend pas.
          verifier "?vue=paire" "Voir la liste des relevés"
          # Le tri des paires ne doit ni casser ni perdre l'etat. Sur une
          # base vide, la vue ne dit rien de plus que son lien de retour —
          # c'est ce lien qui est verifiable : il doit ramener a la liste
          # en gardant le tri demande.
          verifier "?vue=paire&tri=moyenne&sens=desc" \
                   "href='/comptages?tri=moyenne&sens=desc'>Voir la liste"
          # Un filtre mode applique doit se lire dans la page.
          verifier "?mode=unique" "mode unique"
          # Un parametre illisible doit etre ecarte ET dit. Le texte
          # contient une apostrophe, deja echappee en amont par `lire`,
          # donc elle reste litterale : on cherche un fragment sans elle.
          verifier "?depuis=bidon" "pas une date (AAAA-MM-JJ), filtre ignor"
          # Une vue inconnue reste lisible et retombe sur la liste.
          verifier "?vue=inconnu" "Voir par paire de gares"
          # La pagination n'est PAS verifiee ici : le conteneur de test
          # demarre vide, donc il n'y a rien a paginer et le seuil ne
          # serait jamais franchi. Elle est couverte par la suite pytest,
          # qui construit 205 relevés.
          # Filtre et tri combines : les deux doivent survivre ensemble.
          verifier "?mode=unique&tri=passengers&sens=asc" "mode=unique"

      - name: Verifier que la publication est inactive sans identifiants
        run: |
          # Le conteneur de test n'a pas de cle data.gouv. Il doit le dire
          # plutot que de pretendre avoir publie, et ne doit rien laisser
          # dans le volume de donnees.
          etat=$(curl -sS http://127.0.0.1:8000/api/publish)
          echo "$etat"
          echo "$etat" | grep -q '"enabled": false' || { echo "publication active sans cle"; exit 1; }
          test ! -f "$RUNNER_TEMP/data/publish.json" || { echo "etat ecrit sans publication"; exit 1; }

      - name: Journal si echec
        if: failure()
        run: docker logs comptagefer-test || true

      - name: Arreter le conteneur
        if: always()
        run: docker rm -f comptagefer-test || true

  # Les tests de file hors ligne vivent dans du JavaScript, donc
  # pytest ne les voit pas. Ils passaient mais n'etaient jamais
  # executes par personne.
  offline-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests de la file hors ligne
        run: node --test tests/offline.test.js
